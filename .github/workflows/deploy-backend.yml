name: Deploy Backend to Azure container apps

# trigger on push to main branch or when the deploy-backend.yml file is modified. Also allow manual trigger via workflow_dispatch.
# the path is telling that only when push is done on backend foder or deploy-backend.yml file


on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: #Allow manual trigger

#the env variable is used to store the name of the container app, which can be referenced in the deployment step. Unlike secrets 
#environment variables are not encrypted and are visible in the workflow logs, so they should not contain sensitive information. 
#In this case, it is used to store the name of the container app for easier maintenance. 
#Dont store sensitive information such as credentials in environment variables, use GitHub Secrets instead.
#This allows for easier maintenance and updates, as you only need to change the value in one place if the container app name changes.
#test

env:
  CONTAINER_APP_NAME: sentiment-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
# login to azure dashboard using with creds, referencing to the secrets stored in github
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


#authentication into Azure Container Registry using username such as admin, with specified permissions, and password. 


      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }} --username ${{ secrets.ACR_USERNAME }} --password ${{ secrets.ACR_PASSWORD }}

#build docker image by passing the registry name, 
#whenever external registry is used, the image name should be in the format of registryname.azurecr.io/imagename:tag 
# -f is telling to use this file for build,  backend is telling that  and to look for in the backend directory
#In this case, the azure is tagged as latest.

      - name: Build Backend Docker Image
        run: docker build -t ${{secrets.ACR_NAME}}.azurecr.io/backend:latest -f backend/Dockerfile backend

      - name: Push Backend Docker Image to ACR
        run: docker push ${{secrets.ACR_NAME}}.azurecr.io/backend:latest

#once image is pushed to the acr, docker has done its part, to run the image now we use azure cli command to update the container app with the new image.
#its equivalent of running the image, we may need to specify the resource group so that azure will use that resource group  
      - name: Deploy to Azure Container Apps
        run: az containerapp create --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --image ${{secrets.ACR_NAME}}.azurecr.io/backend:latest --environment ${{ secrets.CONTAINER_APP_ENVIRONMENT }} --target-port 8000


   
    